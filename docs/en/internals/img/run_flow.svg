<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" font-family="sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="940" height="300" fill="#ffffff"/><rect x="20" y="30" width="220" height="74" rx="8" fill="#dafbe1" stroke="#8c959f"/><text x="130.0" y="54" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">The adjusted shape on screen</text><text x="130.0" y="74" text-anchor="middle" font-size="11" fill="#57606a">(after dressing: the garment as it is)</text><line x1="240" y1="67" x2="290" y2="67" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="292" y="30" width="230" height="74" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="407.0" y="54" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">As the button is pressed:</text><text x="407.0" y="74" text-anchor="middle" font-size="11" fill="#57606a">pattern edits carried (no physics)</text><line x1="522" y1="67" x2="572" y2="67" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><rect x="574" y="22" width="300" height="92" rx="8" fill="#fff8c5" stroke="#8c959f"/><text x="724.0" y="46" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">Simulation (a separate process)</text><text x="724.0" y="66" text-anchor="middle" font-size="11" fill="#57606a">cloth moved on the NVIDIA GPU</text><text x="724.0" y="84" text-anchor="middle" font-size="11" fill="#57606a">Blender stays responsive</text><line x1="650" y1="114" x2="520" y2="180" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><text x="591.0" y="141.0" font-size="12" fill="#57606a">each frame</text><line x1="800" y1="114" x2="800" y2="180" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><text x="806.0" y="141.0" font-size="12" fill="#57606a">when stopped</text><rect x="330" y="182" width="260" height="92" rx="8" fill="#ddf4ff" stroke="#8c959f"/><text x="460.0" y="206" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">Frames of the run</text><text x="460.0" y="226" text-anchor="middle" font-size="11" fill="#57606a">folder AC9_ClothSim_jobs</text><text x="460.0" y="244" text-anchor="middle" font-size="11" fill="#57606a">next to the .blend</text><rect x="660" y="182" width="260" height="92" rx="8" fill="#ffebe9" stroke="#8c959f"/><text x="790.0" y="206" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">Last shape</text><text x="790.0" y="226" text-anchor="middle" font-size="11" fill="#57606a">garment AC9_Garment_&lt;garment&gt;</text><text x="790.0" y="244" text-anchor="middle" font-size="11" fill="#57606a">saved in the .blend</text></svg>
