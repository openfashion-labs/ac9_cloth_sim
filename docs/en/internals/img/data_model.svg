<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="920" font-family="sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="920" height="490" fill="#ffffff"/><rect x="300" y="20" width="320" height="92" rx="8" fill="#fff8c5" stroke="#8c959f"/><text x="460.0" y="44" text-anchor="middle" font-size="14" fill="#1f2328" font-weight="bold">Pattern data (the truth)</text><text x="460.0" y="65" text-anchor="middle" font-size="12" fill="#57606a">Text AC9_ClothSim_Spec_&lt;garment&gt;</text><text x="460.0" y="84" text-anchor="middle" font-size="12" fill="#57606a">JSON: shapes, seams, placement, fabrics</text><rect x="30" y="180" width="260" height="120" rx="8" fill="#ddf4ff" stroke="#8c959f"/><text x="160.0" y="204" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="bold">Flat pattern</text><text x="160.0" y="226" text-anchor="middle" font-size="13" fill="#57606a">one object per piece</text><text x="160.0" y="246" text-anchor="middle" font-size="13" fill="#57606a">AC9_Piece_&lt;piece&gt;</text><rect x="330" y="180" width="260" height="120" rx="8" fill="#dafbe1" stroke="#8c959f"/><text x="460.0" y="204" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="bold">Adjusted Shape</text><text x="460.0" y="226" text-anchor="middle" font-size="13" fill="#57606a">one object per piece</text><text x="460.0" y="246" text-anchor="middle" font-size="13" fill="#57606a">a pair: one object + Mirror</text><text x="460.0" y="266" text-anchor="middle" font-size="13" fill="#57606a">AC9_Placed_&lt;piece&gt;</text><rect x="630" y="180" width="260" height="120" rx="8" fill="#ffebe9" stroke="#8c959f"/><text x="760.0" y="204" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="bold">Dressed garment</text><text x="760.0" y="226" text-anchor="middle" font-size="13" fill="#57606a">one mesh for all pieces</text><text x="760.0" y="246" text-anchor="middle" font-size="13" fill="#57606a">each face knows its piece</text><text x="760.0" y="266" text-anchor="middle" font-size="13" fill="#57606a">AC9_Garment_&lt;garment&gt;</text><line x1="380" y1="112" x2="170" y2="178" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><text x="281.0" y="139.0" font-size="12" fill="#57606a">made again</text><line x1="460" y1="112" x2="460" y2="178" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><text x="466.0" y="139.0" font-size="12" fill="#57606a">Place</text><line x1="540" y1="112" x2="750" y2="178" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><text x="651.0" y="139.0" font-size="12" fill="#57606a">Simulate</text><text x="30" y="328" font-size="13" font-weight="bold" fill="#1f2328">Blender's own click and box select</text><text x="38" y="350" font-size="13" fill="#57606a">no (pick with AC9 tools)</text><text x="338" y="350" font-size="13" fill="#57606a">no (pick with AC9 tools)</text><text x="638" y="350" font-size="13" fill="#57606a">no: the whole garment only</text><line x1="820" y1="300" x2="820" y2="388" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/><text x="826.0" y="338.0" font-size="12" fill="#57606a">AC9 pick</text><rect x="630" y="390" width="260" height="84" rx="8" fill="#f6f8fa" stroke="#8c959f"/><text x="760.0" y="414" text-anchor="middle" font-size="14" fill="#1f2328" font-weight="bold">Handle (an Empty)</text><text x="760.0" y="435" text-anchor="middle" font-size="12" fill="#57606a">AC9_Move_&lt;piece&gt;</text><text x="760.0" y="454" text-anchor="middle" font-size="12" fill="#57606a">made when an AC9 tool picks it</text></svg>
