schema_version = "1.0.0"

id = "ac9_cloth_sim"
version = "0.1.1"
name = "AC9 Cloth Sim"
tagline = "Sew garment patterns and drape them on avatars in Blender"
maintainer = "AC9 <cg-tech@omnisinc.co>"
type = "add-on"
website = "https://openfashion-labs.github.io/ac9_cloth_sim/"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Physics", "Modeling"]

# windows-x64 only: the solver needs NVIDIA Warp (CUDA). The wheels are not in the repository (warp-lang is about
# 150 MB); .github/workflows/release.yml downloads these exact files from PyPI, checks their sha256 and builds.
platforms = ["windows-x64"]
wheels = [
  "./wheels/newton-1.6.0-py3-none-any.whl",
  "./wheels/warp_lang-1.17.0-py3-none-win_amd64.whl",
]
copyright = [
  "2026 OpenFashion (AC9)",
  "2025 The Newton Developers (newton, Apache-2.0; solver/newton_patch holds changed copies)",
  "2022-2026 NVIDIA Corporation (warp-lang, Apache-2.0, with NVIDIA components under their own licenses)",
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "/*.zip",
  "*.blend[1-9]",
  "/CLAUDE.md",
  "/docs/",
  "/.github/",
  "/CHANGELOG.md",
  # ドキュメントサイト (Docusaurus) の設定。利用者には無関係で、手元で npm install した node_modules が紛れ込むのを防ぐ
  "/website/",
]
