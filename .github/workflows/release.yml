name: release

# リリース ZIP のビルドと GitHub Release への添付。
#   - タグ `v*` の push: そのタグをビルドして同名の Release に ZIP を添付する
#     （タグは release tags ルールセットにより admin しか打てない）。
#     Release が無ければ draft で作り、本文は CHANGELOG.md の該当節から取る
#   - 手動実行: push 済みの既存タグを指定して同じことをやり直す
#     （注意: Releases 画面で新しいタグ名の draft を作っても、公開するまで git タグは
#     存在しないので手動実行では checkout できない。タグを先に push すること）
#   - PR: このファイル・manifest を変えた PR ではビルドだけ行い、Release には触らない
# ビルドには Blender 本体が要るため、公式配布の Linux 版を runner に落として
# `blender --command extension build` を使う（手元に Blender が無くてもリリースできる）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing (pushed) release tag to build and attach the ZIP to (e.g. v1.0.0)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - blender_manifest.toml
      - THIRD_PARTY_NOTICES.txt
      - licenses/**

permissions:
  contents: read

# 同じタグの run（タグ push と手動実行など）が重ならないようにする
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # ビルドに使う Blender。sha256 は https://download.blender.org/release/Blender<系列>/ にある
  # リリースごとの一覧ファイル blender-<版>.sha256 の linux-x64.tar.xz の行から取る
  # （tar.xz 単体の .sha256 は無い）。Dependabot の対象外なので手動で上げる
  BLENDER_VERSION: "5.2.1"
  BLENDER_SHA256: "a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9"
  # 対象タグ。PR では空。run: の中では必ずこの環境変数経由で参照する
  # （`${{ }}` をシェルに直接展開すると入力値がコマンドとして解釈され得る）
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Check that the tag matches the manifest version and has a CHANGELOG entry
        if: env.TAG != ''
        run: |
          ver=$(sed -nE 's/^version = "([^"]+)".*/\1/p' blender_manifest.toml)
          if [ "$TAG" != "v$ver" ]; then
            echo "::error::tag '$TAG' does not match blender_manifest.toml version '$ver'"
            exit 1
          fi
          if ! grep -qE "^## \[${ver//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$ver]' section (still under [Unreleased]?)"
            exit 1
          fi

      # 封印（LLM/manifest.toml と __init__.py の AC9_GUIDANCE_BUILD）は開発元が版のコミットに入れておく。
      # CI では作らず、入っているかだけ見る（タグのビルドだけ。190 MB を落とす前に止める）
      - name: Check that the LLM/ documents are sealed
        if: env.TAG != ''
        run: |
          grep -q '^build_id = ' LLM/manifest.toml || { echo "::error::LLM/manifest.toml is not sealed"; exit 1; }
          grep -q '^AC9_GUIDANCE_BUILD = ' __init__.py || { echo "::error::__init__.py has no AC9_GUIDANCE_BUILD"; exit 1; }

      # 計算に使う wheel（newton・warp-lang・scipy の Windows 用）を PyPI から落として wheels/ に置く。
      # リポジトリには置かない（warp-lang が約 150 MB）。版は blender_manifest.toml の wheels と同じで、
      # sha256 で PyPI の公式ファイルそのものであることを確かめる（中身は改変しない）。
      # solver/newton_patch/ は newton 1.6.0 を元にした改変コピーなので、newton の版を上げるときは
      # solver/newton_patch/ と solver/newton_vbd.py の NEWTON_BASE_SHA256 も合わせて直す
      # （合わないと利用者の計算が始まらずに止まる。下で照合する）
      - name: Download the pinned wheels
        run: |
          mkdir wheels
          python3 -m pip download --no-deps --only-binary :all: \
            --platform win_amd64 --python-version 3.13 --implementation cp \
            -d wheels newton==1.6.0 warp-lang==1.17.0 scipy==1.18.1
          cd wheels
          ls -l
          [ "$(ls | wc -l)" -eq 3 ] || { echo "::error::expected 3 wheels"; exit 1; }
          sha256sum -c - <<'EOF'
          5eedebe17d7261ca39e8f97c2f2f20e22e7264d0aed01782f3cb1dd60180b872  newton-1.6.0-py3-none-any.whl
          ca35c82242a7553046f09023bbe56750b5c3d9af72625bd1a905a56d3189771d  warp_lang-1.17.0-py3-none-win_amd64.whl
          559ed65f60c1af5a03f3912605a1b5114f522c7c32fb23c3376ae8f03219fe28  scipy-1.18.1-cp313-cp313-win_amd64.whl
          EOF
          # manifest の wheels と、落としたファイルの名前が一致するか（両方向）
          cd ..
          for w in wheels/*.whl; do
            grep -qF "\"./$w\"" blender_manifest.toml || { echo "::error::$w is not listed in blender_manifest.toml"; exit 1; }
          done
          [ "$(grep -cE '^ *"\./wheels/[^"]+\.whl",?$' blender_manifest.toml)" -eq 3 ] \
            || { echo "::error::blender_manifest.toml does not list exactly these 3 wheels"; exit 1; }
          # newton の wheel の中の 2 ファイルが、solver/newton_patch/ の元にした版（NEWTON_BASE_SHA256）か
          python3 - <<'EOF'
          import ast, hashlib, sys, zipfile
          src = open('solver/newton_vbd.py', encoding='utf-8').read()
          table = next(ast.literal_eval(n.value) for n in ast.parse(src).body if isinstance(n, ast.Assign)
                       and any(getattr(t, 'id', None) == 'NEWTON_BASE_SHA256' for t in n.targets))
          z = zipfile.ZipFile('wheels/newton-1.6.0-py3-none-any.whl')
          for f, ok in table.items():
              h = hashlib.sha256(z.read('newton/_src/solvers/vbd/' + f)).hexdigest()
              if h not in ok:
                  print(f"::error::the newton wheel's {f} is not the Newton solver/newton_patch/ was made from")
                  sys.exit(1)
          print('newton matches NEWTON_BASE_SHA256')
          EOF

      # どのコミットから作った ZIP かを ZIP の中に残す
      - name: Write BUILD_INFO.txt
        run: |
          ver=$(sed -nE 's/^version = "([^"]+)".*/\1/p' blender_manifest.toml)
          printf 'AC9 Cloth Sim %s\ncommit %s (%s)\nbuilt %s\n' "$ver" "$(git rev-parse HEAD)" "${TAG:-$GITHUB_REF}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD_INFO.txt

      # Blender 本体と出力先はソースディレクトリの外（RUNNER_TEMP）に置く。
      # 中に置くと paths_exclude_pattern に掛からず、Blender ごと ZIP に入ってしまう
      - name: Download Blender
        run: |
          series="${BLENDER_VERSION%.*}"
          url="https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-connrefused --retry-all-errors -o blender.tar.xz "$url"
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          mkdir blender
          tar -xJf blender.tar.xz -C blender --strip-components=1

      - name: Install libraries Blender needs to start headless
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxi6 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libxxf86vm1 libxfixes3 libgomp1

      - name: Validate and build the extension
        run: |
          blender="$RUNNER_TEMP/blender/blender"
          dist="$RUNNER_TEMP/dist"
          "$blender" --command extension validate .
          mkdir -p "$dist"
          "$blender" --command extension build --source-dir . --output-dir "$dist"
          "$blender" --command extension validate "$dist"/*.zip
          ls -l "$dist"

      - name: Check the ZIP contents
        run: |
          zip=$(ls "$RUNNER_TEMP"/dist/*.zip)
          entries=$(unzip -Z1 "$zip")
          echo "--- top-level entries"
          echo "$entries" | cut -d/ -f1 | sort -u
          # アドオンの入口と、配布に含める LLM/ と tests/ が入っているか（除外パターンの編集ミスで欠けるのを防ぐ）
          for need in '__init__.py' 'blender_manifest.toml' 'LLM/manifest.toml' 'tests/' \
                      'THIRD_PARTY_NOTICES.txt' 'licenses/' 'BUILD_INFO.txt'; do
            if ! echo "$entries" | grep -qE "^${need}"; then
              echo "::error::the ZIP lacks $need"
              exit 1
            fi
          done
          # 配布物に入ってはいけないもの（manifest の paths_exclude_pattern と対応）
          if echo "$entries" | grep -E '^(\.|CLAUDE\.md|CHANGELOG\.md|docs/|website/|.*__pycache__/)' ; then
            echo "::error::the ZIP contains files that paths_exclude_pattern should have removed"
            exit 1
          fi
          # wheel が manifest の 3 本とも、そのまま入っているか
          n=$(echo "$entries" | grep -cE '^wheels/[^/]+\.whl$' || true)
          if [ "$n" -ne 3 ]; then
            echo "::error::the ZIP has $n wheels, expected 3"
            exit 1
          fi
          (cd wheels && for w in *.whl; do unzip -p "$zip" "wheels/$w" | cmp - "$w" || { echo "::error::wheels/$w differs in the ZIP"; exit 1; }; done)
          # サイズの範囲（ソースと workspace.blend で数 MB ＋ wheel で約 190 MB。
          # website/node_modules などが紛れ込むと上に、wheel が抜けると下に外れる）
          size=$(stat -c %s "$zip")
          if [ "$size" -lt 150000000 ] || [ "$size" -gt 260000000 ]; then
            echo "::error::ZIP is $size bytes; expected 150-260 MB (the add-on and its 3 wheels)"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zip
          path: ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error
          # PR の ZIP（約 190 MB）は中身の確認に数日あれば足りる。タグの ZIP は Release にも添付される
          retention-days: ${{ env.TAG != '' && 90 || 5 }}

  publish:
    needs: build
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-zip
          path: dist

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release が無ければ draft で作る。本文は CHANGELOG.md の該当節
          # （`## [x.y.z]` から次の `## ` または末尾のリンク定義まで）。
          # 既にあれば（draft でも）本文は触らず ZIP を差し替えるだけ
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ver="${TAG#v}"
            awk -v ver="$ver" '
              $0 ~ "^## \\[" ver "\\]" { on=1; next }
              on && (/^## / || /^\[/) { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "::error::could not extract the [$ver] section from CHANGELOG.md"
              exit 1
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
