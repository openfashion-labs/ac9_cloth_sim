name: release

# リリース ZIP のビルドと GitHub Release への添付。
#   - タグ `v*` の push: そのタグをビルドして同名の Release に ZIP を添付する
#     （タグは release tags ルールセットにより admin しか打てない）。
#     Release が無ければ draft で作り、本文は CHANGELOG.md の該当節から取る
#   - 手動実行: push 済みの既存タグを指定して同じことをやり直す
#     （注意: Releases 画面で新しいタグ名の draft を作っても、公開するまで git タグは
#     存在しないので手動実行では checkout できない。タグを先に push すること）
#   - PR: このファイル・manifest を変えた PR ではビルドだけ行い、Release には触らない
# ビルドには Blender 本体が要るため、公式配布の Linux 版を runner に落として
# `blender --command extension build` を使う（手元に Blender が無くてもリリースできる）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing (pushed) release tag to build and attach the ZIP to (e.g. v1.0.0)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - blender_manifest.toml
      - THIRD_PARTY_NOTICES.txt
      - licenses/**
      - dress.py
      - solver/**
      - tests/test_solver_math.py
      - tools/**
      - _addon.py
      - core/live_session.py
      - core/prepared_candidate.py
      - place_lay.py
      - i18n_ja.py
      - distribution.py
      - runtime_repair.py
      - runtime_repair_worker.py
      - tests/test_runtime_repair.py
      - tests/test_distribution_repository_index.py
      - tests/test_runtime_release_inputs.py
      - tests/test_release_assets.py
      - .github/release_scope.json
      - draft_tool.py
      - dart_ui.py
      - spread_ui.py
      - place_targets.py
      - core/**
      - tests/**

permissions:
  contents: read

# 同じタグの run（タグ push と手動実行など）が重ならないようにする
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # ビルドに使う Blender。sha256 は https://download.blender.org/release/Blender<系列>/ にある
  # リリースごとの一覧ファイル blender-<版>.sha256 の linux-x64.tar.xz の行から取る
  # （tar.xz 単体の .sha256 は無い）。Dependabot の対象外なので手動で上げる
  BLENDER_VERSION: "5.2.1"
  BLENDER_SHA256: "a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9"
  # 対象タグ。PR では空。run: の中では必ずこの環境変数経由で参照する
  # （`${{ }}` をシェルに直接展開すると入力値がコマンドとして解釈され得る）
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Check that the tag matches the manifest version and has a CHANGELOG entry
        if: env.TAG != ''
        run: |
          ver=$(sed -nE 's/^version = "([^"]+)".*/\1/p' blender_manifest.toml)
          if [ "$TAG" != "v$ver" ]; then
            echo "::error::tag '$TAG' does not match blender_manifest.toml version '$ver'"
            exit 1
          fi
          if ! grep -qE "^## \[${ver//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$ver]' section (still under [Unreleased]?)"
            exit 1
          fi

      # 封印（LLM/manifest.toml と __init__.py の AC9_GUIDANCE_BUILD）は開発元が版のコミットに入れておく。
      # CI では作らず、入っているかだけ見る（タグのビルドだけ。190 MB を落とす前に止める）
      - name: Check that the LLM/ documents are sealed
        if: env.TAG != ''
        run: |
          grep -q '^build_id = ' LLM/manifest.toml || { echo "::error::LLM/manifest.toml is not sealed"; exit 1; }
          grep -q '^AC9_GUIDANCE_BUILD = ' __init__.py || { echo "::error::__init__.py has no AC9_GUIDANCE_BUILD"; exit 1; }

      # 計算に使う wheel（newton・warp-lang の Windows 用）を PyPI から落として wheels/ に置く。
      # リポジトリには置かない（warp-lang が約 150 MB）。版は blender_manifest.toml の wheels と同じで、
      # sha256 で PyPI の公式ファイルそのものであることを確かめる（中身は改変しない）。
      # solver/newton_patch/ は newton 1.6.0 を元にした改変コピーなので、newton の版を上げるときは
      # solver/newton_patch/ と solver/newton_vbd.py の NEWTON_BASE_SHA256 も合わせて直す
      # （合わないと利用者の計算が始まらずに止まる。下で照合する）
      - name: Check solver dependency imports
        run: |
          python3 - <<'EOF'
          import ast
          from pathlib import Path
          paths = [Path('dress.py'), *Path('solver').rglob('*.py')]
          for path in paths:
              for node in ast.walk(ast.parse(path.read_text(encoding='utf-8'))):
                  names = ([node.module or ''] if isinstance(node, ast.ImportFrom)
                           else [item.name for item in node.names] if isinstance(node, ast.Import) else [])
                  if any(name.split('.')[0] == 'scipy' for name in names):
                      raise SystemExit(f'{path}:{node.lineno}: SciPy is not a bundled dependency')
          EOF

      - name: Check release scope contract
        if: hashFiles('.github/release_scope.json') != ''
        run: python3 tools/check_release_scope.py --root . --phase plan

      - name: Check distribution CPU safety
        if: hashFiles('tools/download_distribution_wheels.py') != ''
        run: |
          python3 -m unittest discover -s tests -p test_distribution_repository_index.py
          python3 -m unittest discover -s tests -p test_runtime_repair.py
          python3 -m unittest discover -s tests -p test_runtime_release_inputs.py
          python3 -m unittest discover -s tests -p test_release_assets.py
          python3 -m unittest discover -s tests -p test_candidate_repository.py
          python3 -m unittest discover -s tests -p test_distribution_publication.py
          python3 -m unittest discover -s tests -p test_public_repository.py

      - name: Download and verify the pinned wheels
        if: hashFiles('tools/download_distribution_wheels.py') != ''
        run: |
          python3 tools/download_distribution_wheels.py --out wheels --source . --prepare-manifest

      # Preserve the pre-tools stable-tag rebuild contract, including its original pins.
      - name: Download the legacy stable-tag wheels
        if: env.TAG != '' && hashFiles('tools/download_distribution_wheels.py') == ''
        run: |
          mkdir wheels
          python3 -m pip download --no-deps --only-binary :all: \
            --platform win_amd64 --python-version 3.13 --implementation cp \
            -d wheels newton==1.6.0 warp-lang==1.17.0
          cd wheels
          ls -l
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected 2 wheels"; exit 1; }
          sha256sum -c - <<'EOF'
          5eedebe17d7261ca39e8f97c2f2f20e22e7264d0aed01782f3cb1dd60180b872  newton-1.6.0-py3-none-any.whl
          ca35c82242a7553046f09023bbe56750b5c3d9af72625bd1a905a56d3189771d  warp_lang-1.17.0-py3-none-win_amd64.whl
          EOF
          # manifest の wheels と、落としたファイルの名前が一致するか（両方向）
          cd ..
          for w in wheels/*.whl; do
            grep -qF "\"./$w\"" blender_manifest.toml || { echo "::error::$w is not listed in blender_manifest.toml"; exit 1; }
          done
          [ "$(grep -cE '^ *"\./wheels/[^"]+\.whl",?$' blender_manifest.toml)" -eq 2 ] \
            || { echo "::error::blender_manifest.toml does not list exactly these 2 wheels"; exit 1; }
          # newton の wheel の中の 2 ファイルが、solver/newton_patch/ の元にした版（NEWTON_BASE_SHA256）か
          python3 - <<'EOF'
          import ast, hashlib, sys, zipfile
          src = open('solver/newton_vbd.py', encoding='utf-8').read()
          table = next(ast.literal_eval(n.value) for n in ast.parse(src).body if isinstance(n, ast.Assign)
                       and any(getattr(t, 'id', None) == 'NEWTON_BASE_SHA256' for t in n.targets))
          z = zipfile.ZipFile('wheels/newton-1.6.0-py3-none-any.whl')
          for f, ok in table.items():
              h = hashlib.sha256(z.read('newton/_src/solvers/vbd/' + f)).hexdigest()
              if h not in ok:
                  print(f"::error::the newton wheel's {f} is not the Newton solver/newton_patch/ was made from")
                  sys.exit(1)
          print('newton matches NEWTON_BASE_SHA256')
          EOF

      # どのコミットから作った ZIP かを ZIP の中に残す
      - name: Write BUILD_INFO.txt
        run: |
          ver=$(sed -nE 's/^version = "([^"]+)".*/\1/p' blender_manifest.toml)
          printf 'AC9 Cloth Sim %s\ncommit %s (%s)\nbuilt %s\n' "$ver" "$(git rev-parse HEAD)" "${TAG:-$GITHUB_REF}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD_INFO.txt

      # Blender 本体と出力先はソースディレクトリの外（RUNNER_TEMP）に置く。
      # 中に置くと paths_exclude_pattern に掛からず、Blender ごと ZIP に入ってしまう
      - name: Download Blender
        run: |
          series="${BLENDER_VERSION%.*}"
          url="https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-connrefused --retry-all-errors -o blender.tar.xz "$url"
          echo "${BLENDER_SHA256}  blender.tar.xz" | sha256sum -c -
          mkdir blender
          tar -xJf blender.tar.xz -C blender --strip-components=1

      - name: Install libraries Blender needs to start headless
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxi6 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libxxf86vm1 libxfixes3 libgomp1 xvfb xauth

      - name: Check every context command, mirror regression, 3D carry and actual undo before packaging
        if: hashFiles('tests/test_command_scene.py') != ''
        run: |
          blender="$RUNNER_TEMP/blender/blender"
          mkdir -p "$RUNNER_TEMP/command-package" "$RUNNER_TEMP/command-checks" "$RUNNER_TEMP/command-extensions"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/command-package/ac9_cloth_sim"
          export BLENDER_USER_EXTENSIONS="$RUNNER_TEMP/command-extensions"
          for test in test_command_symmetry test_context_contracts test_command_scene test_numeric_size test_numeric_gap_symmetry; do
            "$blender" -b --factory-startup --python-exit-code 1 --python "tests/$test.py" -- \
              "$RUNNER_TEMP/command-package" "$RUNNER_TEMP/command-checks/$test.json"
          done
          xvfb-run -a "$blender" --factory-startup --enable-event-simulate --python-exit-code 1 \
            --python tests/test_command_modal.py -- "$RUNNER_TEMP/command-package" "$RUNNER_TEMP/command-checks/modal.json"
          python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"command-checks/modal.json"; assert json.loads(p.read_text())["ok"]'
          xvfb-run -a "$blender" --factory-startup --enable-event-simulate --python-exit-code 1 \
            --python tests/test_clone_modal.py -- "$RUNNER_TEMP/command-package" "$RUNNER_TEMP/command-checks/clone-modal.json"
          python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"command-checks/clone-modal.json"; assert json.loads(p.read_text())["ok"]'

      - name: Validate and build the extension
        run: |
          blender="$RUNNER_TEMP/blender/blender"
          dist="$RUNNER_TEMP/dist"
          "$blender" --command extension validate .
          mkdir -p "$dist"
          "$blender" --command extension build --source-dir . --output-dir "$dist"
          "$blender" --command extension validate "$dist"/*.zip
          ls -l "$dist"

      - name: Check the ZIP contents
        run: |
          zip=$(ls "$RUNNER_TEMP"/dist/*.zip)
          entries=$(unzip -Z1 "$zip")
          echo "--- top-level entries"
          echo "$entries" | cut -d/ -f1 | sort -u
          # アドオンの入口と、配布に含める LLM/ と tests/ が入っているか（除外パターンの編集ミスで欠けるのを防ぐ）
          for need in '__init__.py' 'blender_manifest.toml' 'LLM/manifest.toml' 'tests/' 'workspace.blend' 'avatar.blend' \
                      'THIRD_PARTY_NOTICES.txt' 'licenses/' 'BUILD_INFO.txt'; do
            if ! echo "$entries" | grep -qE "^${need}"; then
              echo "::error::the ZIP lacks $need"
              exit 1
            fi
          done
          # 配布物に入ってはいけないもの（manifest の paths_exclude_pattern と対応）
          if echo "$entries" | grep -E '^(\.|CLAUDE\.md|CHANGELOG\.md|docs/|website/|.*__pycache__/)' ; then
            echo "::error::the ZIP contains files that paths_exclude_pattern should have removed"
            exit 1
          fi
          # wheel が manifest の 2 本とも、そのまま入っているか
          n=$(echo "$entries" | grep -cE '^wheels/[^/]+\.whl$' || true)
          if [ "$n" -ne 2 ]; then
            echo "::error::the ZIP has $n wheels, expected 2"
            exit 1
          fi
          (cd wheels && for w in *.whl; do unzip -p "$zip" "wheels/$w" | cmp - "$w" || { echo "::error::wheels/$w differs in the ZIP"; exit 1; }; done) || exit 1
          # サイズの範囲（ソースと workspace.blend で数 MB ＋ wheel で約 157 MB。
          # website/node_modules などが紛れ込むと上に、wheel が抜けると下に外れる）
          size=$(stat -c %s "$zip")
          if [ "$size" -lt 150000000 ] || [ "$size" -gt 220000000 ]; then
            echo "::error::ZIP is $size bytes; expected 150-220 MB (the add-on and its 2 wheels)"
            exit 1
          fi

      # PR artifacts only. The canonical full ZIP remains the sole release attachment.
      - name: Derive split distribution preview from the canonical full ZIP
        if: github.event_name == 'pull_request'
        run: |
          full=$(find "$RUNNER_TEMP/dist" -maxdepth 1 -type f -name '*.zip' -print -quit)
          python3 tools/split_distribution.py --full "$full" --out "$RUNNER_TEMP/split-preview"
          blender="$RUNNER_TEMP/blender/blender"
          for package in "$RUNNER_TEMP/split-preview/repository/"*.zip; do
            "$blender" --command extension validate "$package"
          done
          "$blender" --command extension server-generate --repo-dir "$RUNNER_TEMP/split-preview/repository" --html
          python3 tools/check_release_scope.py --root . --phase packages --build "$RUNNER_TEMP/split-preview/build.json"
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' blender_manifest.toml)
          python3 tools/build_candidate_repository.py --source-repo "$RUNNER_TEMP/split-preview/repository" \
            --out "$RUNNER_TEMP/candidate-page" --base-url http://127.0.0.1:8765/ --main-version "$version"

      - name: Rehearse the public catalog without publishing
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from publish_distribution import planned_asset_urls
          from build_public_repository import build_public, EXPECTED_BASE
          temporary = Path(os.environ['RUNNER_TEMP'])
          build = json.loads((temporary/'split-preview/build.json').read_text())
          version = build['main_version']
          urls = planned_asset_urls(build, version, 'openfashion-labs/ac9_cloth_sim', [])
          refs = {'channel':'preview','packages':{role:{'url':urls[role],'bytes':entry['bytes'],'sha256':entry['sha256']} for role,entry in build['packages'].items()}}
          build_public(temporary/'split-preview/repository', refs, [], temporary/'public-catalog-preview', EXPECTED_BASE, version)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name == 'pull_request'
        with:
          name: public-catalog-preview
          path: ${{ runner.temp }}/public-catalog-preview/
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: split-distribution-preview
          path: ${{ runner.temp }}/split-preview/
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zip
          path: ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error
          # PR の ZIP（約 190 MB）は中身の確認に数日あれば足りる。タグの ZIP は Release にも添付される
          retention-days: ${{ env.TAG != '' && 90 || 5 }}

  # Release attachment is handled only by the explicit reviewed-artifact workflow.
  # Tag runs remain build-only, including legacy full ZIP rebuilds.
